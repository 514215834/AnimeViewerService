server:
  # S1：默认仅绑定本机回环；局域网监听需显式改为 0.0.0.0（启动参数 --server.address=0.0.0.0）
  port: 8787
  address: 127.0.0.1

spring:
  application:
    name: AnimeViewerService
  jackson:
    default-property-inclusion: non_null

av:
  # 运行数据目录（token / SQLite 索引库），相对 jar 工作目录
  data-dir: ./data
  # ffmpeg / ffprobe 可执行文件：默认从 PATH 探测；未入 PATH 时填完整路径
  ffmpeg-path: ffmpeg
  ffprobe-path: ffprobe
  bangumi:
    base-url: https://api.bgm.tv
    # 服务端自定义合规 UA（官方 API 要求可识别的 User-Agent）
    user-agent: "AnimeViewerService/${project.version} (personal media server; https://github.com/jinfenglong/AnimeViewer)"
    match-throttle-ms: 400
    # 网络线路：auto（默认，直连失败自动经代理重试并粘性记忆）/ direct（仅直连）/ proxy（仅代理）
    proxy-mode: auto
    # 代理地址（auto 容灾与 proxy 模式使用；默认 Clash Verge 混合端口 7897，按实际修改）
    proxy-host: 127.0.0.1
    proxy-port: 7897
  scan:
    # 启动时自动执行 mtime 增量扫描
    auto-on-start: true
    probe-timeout-seconds: 30
  remux:
    # 同时进行的 ffmpeg 转封装进程上限
    max-concurrent: 3
  proxy:
    # v0.15 流代理域名白名单（逗号分隔，支持 *.example.com 通配子域）；默认空 = 代理禁用（请求返回 403）。
    # 仅代理用户在前端手动添加的源——示例: allowed-hosts: "cdn.example.com,*.another-cdn.net"
    allowed-hosts: ""
    # 同时进行的代理转发上限（超限 503）
    max-concurrent: 6
  webdav:
    # v0.15 WebDAV streamId 会话有效期（分钟）；凭据只随 POST 体流转，不进 URL
    session-ttl-minutes: 10

logging:
  level:
    root: info
