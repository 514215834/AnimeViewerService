server:
  # S1：默认仅绑定本机回环；局域网监听需显式改为 0.0.0.0（启动参数 --server.address=0.0.0.0）
  port: 8787
  address: 127.0.0.1
  error:
    # v0.28：sendError(503/4xx, 可读文案) 的 message 对外可见（转码/转封装并发闸文案前端可读）
    include-message: always

spring:
  application:
    name: AnimeViewerService
  jackson:
    default-property-inclusion: non_null

av:
  # 运行数据目录（token / SQLite 索引库），相对 jar 工作目录
  data-dir: ./data
  # v1.0 D2 桌面壳父进程心跳：仅桌面版由壳注入真实 pid（--av.parent-pid=<壳pid>），0=关闭。
  # 壳进程失联后服务端 5s 内优雅退出（@PreDestroy 收尾托管 aria2c），防孤儿进程占用 8787
  parent-pid: 0
  # ffmpeg / ffprobe 可执行文件：默认从 PATH 探测；未入 PATH 时填完整路径
  ffmpeg-path: ffmpeg
  ffprobe-path: ffprobe
  bangumi:
    base-url: https://api.bgm.tv
    # 服务端自定义合规 UA（官方 API 要求可识别的 User-Agent）
    user-agent: "AnimeViewerService/${project.version} (personal media server; https://github.com/jinfenglong/AnimeViewer)"
    match-throttle-ms: 400
    # 网络线路：auto（默认，直连失败自动经代理重试并粘性记忆）/ direct（仅直连）/ proxy（仅代理）。
    # v1.0 补记四：运行期可在前端设置页覆盖（GET/PUT /api/network/settings，存 SQLite settings 表
    # key=network，保存即时生效无需重启）——此处仅为默认值
    proxy-mode: auto
    # 代理地址（auto 容灾与 proxy 模式使用；默认 Clash Verge 混合端口 7897，按实际修改）。
    # 消费方：Bangumi 匹配 / 订阅检索 / 在线解析 / 在线流转发 / 种子抓取（aria2 下载代理为独立配置 av.aria2.proxy）
    proxy-host: 127.0.0.1
    proxy-port: 7897
  scan:
    # 启动时自动执行 mtime 增量扫描
    auto-on-start: true
    probe-timeout-seconds: 30
  remux:
    # 同时进行的 ffmpeg 转封装进程上限
    max-concurrent: 3
  stream:
    # v0.28 P3：在线流转发（hanime stream）并发上限（超限等待 10s 后 503）
    hanime-max-concurrent: 2
    # v0.28 P1：实时转码并发上限（转码会话分钟级长驻，超限即时拒绝 503）
    transcode-max-concurrent: 1
  proxy:
    # v0.15 流代理域名白名单（逗号分隔，支持 *.example.com 通配子域）；默认空 = 代理禁用（请求返回 403）。
    # 仅代理用户在前端手动添加的源——示例: allowed-hosts: "cdn.example.com,*.another-cdn.net"
    allowed-hosts: ""
    # 同时进行的代理转发上限（超限 503）
    max-concurrent: 6
  webdav:
    # v0.15 WebDAV streamId 会话有效期（分钟）；凭据只随 POST 体流转，不进 URL
    session-ttl-minutes: 10
  aria2:
    # v0.16 下载引擎默认值（运行期可在前端设置页覆盖，存 SQLite settings 表）。
    # PATH 探测不到且未填外部地址时下载模块整体降级：添加磁力返回引导文案 + 一键复制磁力链接。
    # 可执行文件：托管模式从 PATH 探测；未入 PATH 时填完整路径（如 G:/aria2/aria2-1.37.0-win-64bit-build1/aria2c.exe）
    path: aria2c
    # 外部实例模式：填已有 aria2 的 RPC 地址（如 http://127.0.0.1:6800/rpc）后优先于托管模式；secret 为其 rpc-secret
    external-url: ""
    external-secret: ""
    # 托管模式 RPC 监听端口（仅绑定回环）
    rpc-port: 16800
    # 下载目录（默认落在服务 data 目录下，纳入媒体库扫描即可自动入库匹配）
    download-dir: ./data/downloads
    # 同时活动任务上限（aria2 max-concurrent-downloads）
    max-concurrent: 2
    # 全局上传限速（aria2 max-overall-upload-limit 语法，如 2M；空 = 不限）
    upload-limit: ""
    # 注入磁力的公共 tracker（逗号分隔；磁力自带 tracker 之外追加——无 tracker 磁力依赖 DHT 极慢）。
    # v1.0 桌面版实测（2026-09-26）：UDP 直连出国全超时、HTTP 直连劣化，默认换 HTTP tracker——
    # 配合 proxy 经代理 announce 全部可达（旧默认 UDP 列表对存量实例无效，请在设置页自行替换）
    trackers: "udp://tracker.opentrackr.org:1337/announce,udp://tracker.openbittorrent.com:6969/announce,udp://exodus.desync.com:6969/announce"
    # v1.0 下载代理（可空 = 直连）：非空时拉起 aria2 注入 --all-proxy，HTTP(S) tracker announce 走此代理。
    # aria2 不读系统代理，国内网络 UDP tracker/DHT 直连出国常全超时（桌面版实测）；本机 Clash 场景填
    # http://127.0.0.1:7897。注意：UDP tracker/DHT 为 aria2 协议限制不走 HTTP 代理，需 UDP 可达请开代理软件 TUN 模式
    proxy: ""
    # 任务完成后自动触发媒体库增量扫描（NameParser/BangumiMatcher 接管入库匹配）
    auto-scan: true
    # 完成后做种分钟数（0 = 下完即停；个人取资源工具默认不做种，可自行调大）
    seed-time-minutes: 0
    # aria2 证书校验：Windows 版 schannel 吊销检查会致 HTTPS tracker 握手失败（v0.16 原型实测），默认关闭
    check-certificate: false
  subscription:
    # v0.19 SU1 订阅自动化默认值（运行期可在前端设置页覆盖，存 SQLite settings 表）
    # 定时检索间隔（分钟，30~360；订阅命中入待确认队列，全自动为条目级显式开关）
    interval-minutes: 60
    # 资源大小下限（MB，0 = 不限）——滤掉体积异常小的广告/垃圾条目
    min-size-mb: 0
    # 全自动保护 I：每日自动入队上限（超出降级待确认人工把关）
    auto-daily-limit: 5
    # 全自动保护 II：单任务大小上限（MB，0 = 不限）
    auto-max-size-mb: 0
    # 全自动保护 III：仅已匹配条目（媒体库无绑定文件的全自动命中降级待确认）
    auto-only-matched: true
    # v0.20 SU4 新订阅匹配度阈值默认值（0 = 特殊值：全部命中需手动确认；1~100 = 评分达阈值自动入队）
    default-auto-score: 0
    # v0.20 SU5 全局字幕组偏好（逗号分隔；命中任一订阅级/全局偏好即评分 +15）
    global-fansubs: ""
    # v0.20 SU6 已入队集数忽略后续命中（同条目同集数已有 enqueued/auto 命中则跳过；关闭可补收其他字幕组版本）
    skip-enqueued-episode: true
  ai:
    # v0.22 AI0 AI 服务默认值（运行期可在前端设置页覆盖，存 SQLite settings 表）。
    # enabled 总开关（默认关：AI 关闭/失败时全链路行为与 v0.21 一致，零回归不变式）
    enabled: false
    # OpenAI 兼容接口根地址（可含 /v1；本地 Ollama 形如 http://127.0.0.1:11434/v1）
    base-url: https://api.openai.com/v1
    # 模型名（如 gpt-4o-mini / qwen2.5:7b）；apiKey 本地 Ollama 可留空
    model: ""
    api-key: ""
    # 单次请求超时（秒）
    timeout-seconds: 30
    # 小时滚动配额护栏（0 = 不限；超限静默跳过，不影响主链路）
    max-calls-per-hour: 60
    # AI1 命中语义判定为「非本篇」时自动忽略（默认关——误判可清历史重评，谨慎开启）
    auto-ignore-non-episode: false
    # v0.30 A5 单请求 max_tokens 上限（0=不注入；思考型模型勿配过小，否则 content 被截空）
    max-tokens: 512
    # v0.30 A7 媒体库 AI 解析自动绑定阈值（0=关闭仅预填人工确认；1~100 置信度达标自动绑定）
    ai-bind-threshold: 85

logging:
  level:
    root: info
